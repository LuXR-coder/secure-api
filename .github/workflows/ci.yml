name: Security Scan
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -r requirements.txt
          pip install pip-audit

      - name: SAST - Bandit scan
        run: bandit -r . -x venv

      - name: SCA - Pip Audit scan
        run: pip-audit

      # ================= 新增：生成报告并上传 =================
      - name: Generate JSON Security Reports
        run: |
          echo "Generating Bandit JSON report..."
          bandit -r . -x venv -f json -o bandit_report.json || true
          
          echo "Generating Pip-Audit JSON report..."
          pip-audit -f json -o pip_audit_report.json || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            bandit_report.json
            pip_audit_report.json