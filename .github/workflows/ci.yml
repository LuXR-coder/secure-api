name: Security CI Pipeline

# 触发条件：推送到main分支、提交PR时自动运行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 安装依赖和安全工具
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      # SAST静态代码扫描（Bandit）
      - name: Run SAST (Bandit)
        run: bandit -r . -f json -o bandit-report.json || true

      # SCA依赖漏洞扫描（Safety）
      - name: Run SCA (Safety)
        run: safety check --full-report --output safety-report.txt || true

      # 上传扫描报告
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.txt
